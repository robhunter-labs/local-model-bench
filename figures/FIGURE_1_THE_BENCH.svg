<text x="146" y="868" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#8c8479" text-anchor="start" >One laptop, Ollama, one refusal-reduced ~35B model at Q8_0, 22–24 October 2026; 59 requests with retained artifacts. All tasks synthetic;</text>
<text x="64" y="890" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#8c8479" text-anchor="start" >custom private harness, not this repository's suite. Capacity is recall of planted markers, not reasoning; the 16K point used a warm cache and isn't comparable.</text>
<text x="64" y="912" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#8c8479" text-anchor="start" >Reliability rows are small fixed sets, not benchmarks. Source: results/pilot-transcribed/SUMMARY.md.</text>
