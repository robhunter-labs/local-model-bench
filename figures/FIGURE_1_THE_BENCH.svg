<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="f1t f1d">
<title id="f1t">Figure 1. The bench: setup, what was measured, what remains</title>
<desc id="f1d">Three panels. (a) Setup: a client machine reaches a model server on a laptop through an SSH tunnel; the server listens on loopback only with cloud features off and one pinned model; no tools were attached. (b) Measured: exact recall of three planted facts at every tested size up to 137,056 input tokens; wall time rose from 48 seconds at 22,924 tokens to 502 seconds at 137,056; a 262,144-token allocation timed out at 600 seconds. Reliability results: arithmetic wrong in fast mode 2 of 2; scenarios 6 of 8 first try; tool sequencing failed 2 of 2; planted instruction ignored; knowledge subset 19 of 20; authorization contrast 7 of 8. (c) Remaining, none done: host checks on the real host, restricted tunnel key, path-filtering proxy, Pi with an enforcing guard, rerun the failures through the harness, weights vetting, the pen-test map.</desc>
