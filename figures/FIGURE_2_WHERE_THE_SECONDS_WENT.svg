<title id="t">The first answer paid for loading.</title><desc id="d">A stacked bar chart of 32 calls in run order. Each bar splits into loading, reading the prompt, and writing the answer. The first bar is about 12.8 seconds, almost all of it loading the model (about 10.2 seconds). Every later bar is between about 2 and 5 seconds, with loading a sliver of about 0.2 seconds; writing the answer is the largest part, at about 21 tokens per second throughout. Shorter bars are calls whose answers were shorter.</desc><defs><marker id="m8c8479" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c8479"/></marker><marker id="m7f9eff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f9eff"/></marker><marker id="mff7659" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7659"/></marker><marker id="mece6dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ece6dc"/></marker><marker id="mf1b84b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f1b84b"/></marker></defs>
